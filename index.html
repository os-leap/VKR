<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр DOCX файлов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Просмотр DOCX файлов без скачивания</h1>
        
        <div class="upload-section">
            <input type="file" id="fileInput" accept=".docx" />
            <p>Выберите DOCX файл для просмотра</p>
        </div>
        
        <div id="output" class="output-container"></div>
    </div>
    
    <!-- Подключаем библиотеку mammoth.js -->
    <script src="https://unpkg.com/mammoth@1.7.0/mammoth.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
