{% extends "base.html" %}

{% block content %}
    <div class="container">
        <div class="restore-container">
            <h2 class="restore-title">Восстановление данных</h2>
            
            <div class="restore-controls">
                <h3 class="section-title">Выборочное восстановление данных</h3>
                <form id="restore-form" class="restore-form">
                    <div class="restore-group">
                        <label for="restore_date_from" class="form-label">Период с:</label>
                        <input type="date" id="restore_date_from" name="date_from" required class="form-input">
                    </div>
                    <div class="restore-group">
                        <label for="restore_date_to" class="form-label">по:</label>
                        <input type="date" id="restore_date_to" name="date_to" required class="form-input">
                    </div>
                    <div class="restore-group">
                        <label for="restore_action_types" class="form-label">Типы действий:</label>
                        <select id="restore_action_types" name="action_types" multiple size="4" class="form-select">
                            <option value="delete">Восстановить удаленные записи</option>
                            <option value="edit">Отменить редактирование</option>
                        </select>
                    </div>
                    <div class="restore-group">
                        <label for="restore_targets" class="form-label">Названия записей для восстановления (через запятую):</label>
                        <input type="text" id="restore_targets" name="targets" placeholder="Например: Заголовок1, Заголовок2" class="form-input">
                    </div>
                    <button type="submit" class="btn btn-primary btn-restore">Восстановить выбранные данные</button>
                </form>
                <div id="restore-result" class="restore-result"></div>
            </div>

            <div class="restore-actions">
                <a href="{{ url_for('audit_log') }}" class="btn btn-secondary btn-back">Назад к сбору событий</a>
            </div>
        </div>
    </div>

    <script>
        // Function to handle selective data restoration
        document.getElementById('restore-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const dateFrom = formData.get('date_from');
            const dateTo = formData.get('date_to');
            const actionTypes = Array.from(this.querySelectorAll('#restore_action_types option:checked')).map(option => option.value);
            const targets = formData.get('targets').split(',').map(t => t.trim()).filter(t => t !== '');
            
            const resultDiv = document.getElementById('restore-result');
            resultDiv.innerHTML = '<div class="loading">Выполняется восстановление...</div>';
            
            try {
                const response = await fetch('/restore-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        date_from: dateFrom,
                        date_to: dateTo,
                        action_types: actionTypes,
                        targets: targets
                    })
                });
                
                const result = await response.json();
                
                if(result.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            ${result.message}
                        </div>
                    `;
                    // Refresh the page to show updated logs
                    setTimeout(() => location.reload(), 2000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            Ошибка восстановления: ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        Ошибка соединения: ${error.message}
                    </div>
                `;
            }
        });
    </script>
{% endblock %}
