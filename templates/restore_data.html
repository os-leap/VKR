{% extends "base.html" %}

{% block content %}
    <h2>Восстановление данных</h2>
    
    <div class="restore-controls">
        <h3>Выборочное восстановление данных</h3>
        <form id="restore-form" class="restore-form">
            <div class="restore-group">
                <label for="restore_date_from">Период с:</label>
                <input type="date" id="restore_date_from" name="date_from" required>
            </div>
            <div class="restore-group">
                <label for="restore_date_to">по:</label>
                <input type="date" id="restore_date_to" name="date_to" required>
            </div>
            <div class="restore-group">
                <label for="restore_action_types">Типы действий:</label>
                <select id="restore_action_types" name="action_types" multiple size="4">
                    <option value="delete">Восстановить удаленные записи</option>
                    <option value="edit">Отменить редактирование</option>
                </select>
            </div>
            <div class="restore-group">
                <label for="restore_targets">Названия записей для восстановления (через запятую):</label>
                <input type="text" id="restore_targets" name="targets" placeholder="Например: Заголовок1, Заголовок2">
            </div>
            <button type="submit" class="btn btn-warning">Восстановить выбранные данные</button>
        </form>
        <div id="restore-result"></div>
    </div>

    <a href="{{ url_for('audit_log') }}" class="btn-back">Назад к сбору событий</a>

    <script>
        // Function to handle selective data restoration
        document.getElementById('restore-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const dateFrom = formData.get('date_from');
            const dateTo = formData.get('date_to');
            const actionTypes = Array.from(this.querySelectorAll('#restore_action_types option:checked')).map(option => option.value);
            const targets = formData.get('targets').split(',').map(t => t.trim()).filter(t => t !== '');
            
            const resultDiv = document.getElementById('restore-result');
            resultDiv.innerHTML = '<div class="loading">Выполняется восстановление...</div>';
            
            try {
                const response = await fetch('/restore-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        date_from: dateFrom,
                        date_to: dateTo,
                        action_types: actionTypes,
                        targets: targets
                    })
                });
                
                const result = await response.json();
                
                if(result.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            ${result.message}
                        </div>
                    `;
                    // Refresh the page to show updated logs
                    setTimeout(() => location.reload(), 2000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            Ошибка восстановления: ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        Ошибка соединения: ${error.message}
                    </div>
                `;
            }
        });
    </script>
{% endblock %}
